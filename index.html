<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Rocket Dongs Gazette</title>
  <meta name="description" content="Weekly recaps, awards, power rankings and public humiliation for the Rocket Dongs fantasy league.">
  <meta property="og:title" content="📰 The Rocket Dongs Gazette">
  <meta property="og:description" content="This week's recap, awards, roasts and next week's lines. Click if you dare.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pcrawley1.github.io/RocketDongz/">
  <meta property="og:image" content="https://pcrawley1.github.io/RocketDongz/og.png">
  <link rel="stylesheet" href="styles.css?v=20261110123352">
</head>
<body>
  <header class="top">
    <h1 id="app-title">🏈 Fantasy</h1>
    <form id="user-form" class="controls">
      <input id="username" placeholder="Sleeper username" autocomplete="off" aria-label="Sleeper username">
      <select id="season" aria-label="Season"></select>
      <select id="league" aria-label="League"></select>
      <button type="submit">Load</button>
    </form>
  </header>

  <nav class="tabs">
    <button class="tab" data-tab="newsletter">📰 Newsletter</button>
    <button class="tab" data-tab="standings">Standings</button>
    <button class="tab" data-tab="power">Power rankings</button>
    <button class="tab" data-tab="matchups">Matchups</button>
    <button class="tab" data-tab="scores">Weekly scores</button>
    <button class="tab" data-tab="chugs" hidden>🍻 Chugs</button>
    <select id="week" aria-label="Week" hidden></select>
    <button id="share" class="share" type="button">🔗 Share link</button>
  </nav>

  <p id="status" role="status"></p>
  <main id="main"></main>

  <script type="module" src="js/app.js?v=20261110123352"></script>
</body>
</html>
